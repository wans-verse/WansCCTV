name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -q WansCCTV.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build
        run: cd WansCCTV && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-kamera
          path: WansCCTV/camera/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-monitor
          path: WansCCTV/monitor/build/outputs/apk/debug/*.apk
